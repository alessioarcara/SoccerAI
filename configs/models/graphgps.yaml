run_name: graphgps

backbone:
  _target_type_: soccerai.models.backbones:GraphGPSBackbone
  _init_args_:
    din: ${train_ds.num_node_features}
    n_layers: 2
    dout: 64
    drop: 0.1
    norm: layer
    heads: 4
    attn_drop: 0.2

neck:
  _init_args_:
    mode: node               # recurrent cell over node embeddings, then readout
    rnn_dout: 64
