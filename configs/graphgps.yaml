model:
  backbone: 
    type: "graphgps"
    n_layers: 2
    heads: 4
    dout: 64
    drop: 0.1
    attn_drop: 0.5
    norm: "none"

  neck:
    mode: "node"
    rnn_type: "gru"
    rnn_dout: 96
    glob_dout: 32

  head:
    n_layers: 2
    din: 128  # rnn_dout + glob_dout
    drop: 0.5
    
trainer:
  lr: 1e-5
  bs: 128