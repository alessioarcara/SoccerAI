[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
authors = [
  { name = "Alessio Arcara", email = "alessio.arcara@studio.unibo.it" },
  { name = "Francesco Baiocchi", email = "francesco.baiocchi2@studio.unibo.it" },
  { name = "Leonardo Petrilli", email = "leonardo.petrilli@studio.unibo.it" },
]

dependencies = [
  # Pinned to the stack the reference runs were produced with; the PyG
  # extensions required by torch_geometric_temporal only exist as prebuilt
  # wheels for a given torch minor version (see [tool.uv] below).
  "torch==2.7.1",
  "torch_geometric==2.6.1",
  "torch_geometric_temporal==0.56.0",
  "torch_scatter==2.1.2",
  "torch_sparse==0.6.18",
  "torchmetrics>=1.7,<2",
  "numpy>=2,<3",
  "scikit-learn>=1.6,<2",
  "polars>=1.24,<2",
  "pydantic>=2.10,<3",
  "pyyaml",
  "matplotlib",
  "seaborn",
  "tabulate",
  "mplsoccer",
  "Levenshtein",
  "rapidfuzz",
  "loguru",
  "selenium",
  "beautifulsoup4",
  "requests",
  "tqdm",
  "IPython",
  "ipywidgets",
  "wandb[media]",
  "xgboost>=3.2.0",
  "ezconfy==0.2.0",
  "eztrain[wandb]==0.1.2",
]
name = "soccerai"
version = "0.6.0"
requires-python = ">=3.11,<3.13"
readme = "README.md"

[project.optional-dependencies]
dev = [
  "pre-commit",
  "nbstripout",
  "ruff",
  "mypy",
  "types-requests",
  "pytest",
  "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"soccerai.data" = ["resources/*"]

[tool.uv]
# prebuilt torch_scatter / torch_sparse wheels for torch 2.7 + CUDA 12.8
# (never build them from source: that requires torch + a CUDA toolchain)
find-links = ["https://data.pyg.org/whl/torch-2.7.0+cu128.html"]
no-build-package = ["torch-scatter", "torch-sparse"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
